name: Static Checks

on:
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"
      - ".github/workflows/publish-dashboard-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"
      - ".github/workflows/publish-dashboard-bundle.yml"

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Enforce pnpm lockfile policy
        run: test -f pnpm-lock.yaml && test ! -e package-lock.json && test ! -e yarn.lock

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run Vitest package and runner tests
        run: pnpm test

      - name: Build Evidence Lab dashboard
        run: pnpm dashboard:build

      - name: Verify ephemeral Dashboard bundle
        run: |
          test -f dashboard/dist/index.html
          test -n "$(find dashboard/dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dashboard/dist/assets -type f -name '*.css' -print -quit)"
          test -z "$(git ls-files -- dashboard/dist skills/skill-reviewer/dashboard/dist)"
          git check-ignore -q dashboard/dist/index.html
          python3 skills/skill-reviewer/scripts/dashboard_bundle.py package \
            --ui-dir dashboard/dist \
            --output-dir "$RUNNER_TEMP/dashboard-release" \
            --manifest-output "$RUNNER_TEMP/generated-dashboard-manifest.json"
          cmp skills/skill-reviewer/references/dashboard-ui-bundle.json \
            "$RUNNER_TEMP/generated-dashboard-manifest.json"
          archive="$(find "$RUNNER_TEMP/dashboard-release" -maxdepth 1 -type f -name 'dashboard-ui-*.zip' -print -quit)"
          python3 skills/skill-reviewer/scripts/dashboard_bundle.py verify \
            --manifest skills/skill-reviewer/references/dashboard-ui-bundle.json \
            --archive "$archive" \
            --output-dir "$RUNNER_TEMP/verified-dashboard"
          test -f "$RUNNER_TEMP/verified-dashboard/index.html"
          test ! -e "$RUNNER_TEMP/verified-dashboard/dashboard-data.json"

      - name: Self-lint the skill package
        run: python3 skills/skill-reviewer/scripts/lint_skill_package.py skills/skill-reviewer --format text --fail-on error

      - name: Validate behavior eval manifest
        run: python3 -m json.tool skills/skill-reviewer/evals/evals.json > /dev/null

      - name: Validate snapshot contract shape
        run: python3 skills/skill-reviewer/scripts/validate_local_snapshot.py skills/skill-reviewer/evals/local-skill-review-snapshot.json

      - name: Compile Python scripts
        run: python3 -m py_compile skills/skill-reviewer/scripts/dashboard_bundle.py skills/skill-reviewer/scripts/lint_skill_package.py skills/skill-reviewer/scripts/run_claude_eval_executor.py skills/skill-reviewer/scripts/run_codex_eval_executor.py skills/skill-reviewer/scripts/run_codex_eval_plan.py skills/skill-reviewer/scripts/run_codex_skill_evals.py skills/skill-reviewer/scripts/skill_eval_runtime.py skills/skill-reviewer/scripts/serve_skill_dashboard.py skills/skill-reviewer/scripts/start_skill_dashboard.py skills/skill-reviewer/scripts/validate_local_snapshot.py tests/test_run_codex_skill_evals.py
