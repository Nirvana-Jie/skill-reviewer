name: Static Checks

on:
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "docs/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"
      - ".github/workflows/publish-dashboard-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "docs/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"
      - ".github/workflows/publish-dashboard-bundle.yml"

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Enforce pnpm lockfile policy
        run: test -f pnpm-lock.yaml && test ! -e package-lock.json && test ! -e yarn.lock

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest package and runner tests
        run: pnpm test

      - name: Build decision-review Dashboard
        run: pnpm dashboard:build

      - name: Verify ephemeral Dashboard bundle
        run: |
          test -f dashboard/dist/index.html
          test -n "$(find dashboard/dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dashboard/dist/assets -type f -name '*.css' -print -quit)"
          test -z "$(git ls-files -- dashboard/dist skills/skill-reviewer/dashboard/dist)"
          git check-ignore -q dashboard/dist/index.html
          node skills/skill-reviewer/scripts/dashboard_bundle.mjs package \
            --ui-dir dashboard/dist \
            --output-dir "$RUNNER_TEMP/dashboard-release" \
            --manifest-output "$RUNNER_TEMP/generated-dashboard-manifest.json"
          cmp skills/skill-reviewer/assets/dashboard-ui-bundle.json \
            "$RUNNER_TEMP/generated-dashboard-manifest.json"
          archive="$(find "$RUNNER_TEMP/dashboard-release" -maxdepth 1 -type f -name 'dashboard-ui-*.zip' -print -quit)"
          node skills/skill-reviewer/scripts/dashboard_bundle.mjs verify \
            --manifest skills/skill-reviewer/assets/dashboard-ui-bundle.json \
            --archive "$archive" \
            --output-dir "$RUNNER_TEMP/verified-dashboard"
          test -f "$RUNNER_TEMP/verified-dashboard/index.html"
          test ! -e "$RUNNER_TEMP/verified-dashboard/dashboard-data.json"

      - name: Self-lint the skill package
        run: node skills/skill-reviewer/scripts/lint_skill_package.mjs skills/skill-reviewer --format text --fail-on error

      - name: Validate behavior eval manifest
        run: node -e 'JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(require("node:fs").readFileSync(process.argv[1])))' skills/skill-reviewer/evals/evals.json

      - name: Check MJS runtime syntax
        run: find skills/skill-reviewer/scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
