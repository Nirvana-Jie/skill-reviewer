name: Static Checks

on:
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "docs/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "dashboard/**"
      - "docs/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/static-checks.yml"

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Enforce pnpm lockfile policy
        run: test -f pnpm-lock.yaml && test ! -e package-lock.json && test ! -e yarn.lock

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run Vitest package and runner tests
        run: pnpm test

      - name: Build Evidence Lab dashboard
        run: pnpm dashboard:build

      - name: Verify committed Dashboard bundle
        run: |
          git diff --exit-code -- skills/skill-reviewer/dashboard/dist
          test -z "$(git ls-files --others --exclude-standard -- skills/skill-reviewer/dashboard/dist)"

      - name: Self-lint the skill package
        run: python3 skills/skill-reviewer/scripts/lint_skill_package.py skills/skill-reviewer --format text --fail-on error

      - name: Validate behavior eval manifest
        run: python3 -m json.tool skills/skill-reviewer/evals/evals.json > /dev/null

      - name: Validate snapshot contract shape
        run: python3 skills/skill-reviewer/scripts/validate_local_snapshot.py skills/skill-reviewer/evals/local-skill-review-snapshot.json

      - name: Compile Python scripts
        run: python3 -m py_compile skills/skill-reviewer/scripts/lint_skill_package.py skills/skill-reviewer/scripts/run_codex_skill_evals.py skills/skill-reviewer/scripts/skill_eval_runtime.py skills/skill-reviewer/scripts/serve_skill_dashboard.py skills/skill-reviewer/scripts/validate_local_snapshot.py tests/test_run_codex_skill_evals.py
