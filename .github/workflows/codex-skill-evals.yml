name: Codex Skill Evals

on:
  workflow_dispatch:
    inputs:
      codex_model:
        description: "Optional Codex model override. Leave empty to use the action default."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "README.md"
      - "README.zh-CN.md"
      - "references/**"
      - "scripts/**"
      - "evals/**"
      - ".github/codex/**"
      - ".github/workflows/codex-skill-evals.yml"

permissions:
  contents: read

concurrency:
  group: codex-skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-skill-evals:
    name: Run Codex skill-reviewer evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVAL_WORKSPACE: .codex-eval-workspace/iteration-1
      CODEX_MODEL: ${{ github.event.inputs.codex_model || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate snapshot contract shape
        run: python3 scripts/validate_local_snapshot.py evals/local-skill-review-snapshot.json

      - name: Run runner unit tests
        run: python3 -m unittest tests/test_run_codex_skill_evals.py

      - name: Check OpenAI API key secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is required for Codex-backed evals."
            exit 1
          fi

      - name: Run Codex-backed skill evals
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/skill-evals.md
          output-file: .codex-eval-workspace/codex-final-message.md
          model: ${{ env.CODEX_MODEL }}
          safety-strategy: drop-sudo
          sandbox: workspace-write
          codex-args: '["--ask-for-approval", "never"]'

      - name: Materialize generated review artifacts
        run: |
          python3 scripts/run_codex_skill_evals.py \
            --contract evals/local-skill-review-snapshot.json \
            --workspace "$EVAL_WORKSPACE" \
            --from-existing-reviews

      - name: Validate generated snapshot workspace
        run: python3 scripts/validate_local_snapshot.py evals/local-skill-review-snapshot.json "$EVAL_WORKSPACE"

      - name: Guard eval artifacts for secret retention
        id: artifact_secret_guard
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ] || [ ! -d ".codex-eval-workspace" ]; then
            exit 0
          fi
          if grep -R -l --fixed-strings "$OPENAI_API_KEY" ".codex-eval-workspace"; then
            echo "::error::OPENAI_API_KEY value appeared in generated eval artifacts."
            exit 1
          fi

      - name: Upload eval artifacts
        if: always() && steps.artifact_secret_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codex-skill-evals-${{ github.run_id }}
          path: .codex-eval-workspace
          retention-days: 14
