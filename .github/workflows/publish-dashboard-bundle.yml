name: Publish Dashboard Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "skills/skill-reviewer/scripts/dashboard_bundle.mjs"
      - "skills/skill-reviewer/scripts/lib/module-entrypoint.mjs"
      - "skills/skill-reviewer/scripts/lib/strict-utf8.mjs"
      - "skills/skill-reviewer/assets/dashboard-ui-bundle.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-dashboard-bundle.yml"

permissions:
  contents: read

concurrency:
  group: publish-dashboard-bundle
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify versioned bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build the local-only UI
        run: |
          pnpm test
          pnpm dashboard:build

      - name: Resolve the Release identity
        id: release_identity
        run: |
          release_tag="v$(node -p 'require("./package.json").version')"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create deterministic release archive
        run: |
          node skills/skill-reviewer/scripts/dashboard_bundle.mjs package \
            --ui-dir dashboard/dist \
            --output-dir .dashboard-release \
            --release-tag "${{ steps.release_identity.outputs.release_tag }}" \
            --manifest-output .dashboard-release/generated-manifest.json

      - name: Verify committed digest anchor and safe extraction
        run: |
          cmp skills/skill-reviewer/assets/dashboard-ui-bundle.json \
            .dashboard-release/generated-manifest.json
          archive="$(find .dashboard-release -maxdepth 1 -type f -name 'dashboard-ui-*.zip' -print -quit)"
          test -n "$archive"
          node skills/skill-reviewer/scripts/dashboard_bundle.mjs verify \
            --manifest skills/skill-reviewer/assets/dashboard-ui-bundle.json \
            --archive "$archive" \
            --output-dir .dashboard-release/verified
          test -f .dashboard-release/verified/index.html
          test ! -e .dashboard-release/verified/dashboard-data.json
          rm -rf .dashboard-release/verified

      - name: Retain only the immutable release archive
        run: rm .dashboard-release/generated-manifest.json

      - name: Transfer bundle to isolated publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-ui-release
          path: .dashboard-release/dashboard-ui-*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish one versioned GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-ui-release
          path: .dashboard-release

      - name: Publish exactly one verified bundle for this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          archive="$(find .dashboard-release -maxdepth 1 -type f -name 'dashboard-ui-*.zip' -print -quit)"
          test -n "$archive"
          asset_name="$(basename "$archive")"
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets,targetCommitish 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "skill-reviewer $RELEASE_TAG" \
              --notes "Evidence-backed Skill review with one content-addressed Dashboard bundle. The bundle contains no evaluation evidence." \
              --generate-notes \
              --draft
            release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets,targetCommitish)"
          fi

          asset_count="$(jq '.assets | length' <<<"$release_json")"
          existing="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .name' <<<"$release_json")"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_target="$(jq -r '.targetCommitish' <<<"$release_json")"

          verify_tag_target() {
            tag_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
            target_commit="$(gh api "repos/$GH_REPO/commits/$release_target" --jq .sha)"
            if [ "$tag_commit" != "$target_commit" ]; then
              echo "$RELEASE_TAG points to $tag_commit instead of Release target $target_commit" >&2
              exit 1
            fi
          }

          # Draft Releases do not create their tag until publication. Create
          # the expected tag explicitly, or reject a conflicting pre-existing
          # tag, before making the Release public.
          prepare_tag_for_publication() {
            tag_refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG")"
            exact_tag_count="$(jq --arg ref "refs/tags/$RELEASE_TAG" \
              '[.[] | select(.ref == $ref)] | length' <<<"$tag_refs")"
            if [ "$exact_tag_count" -eq 0 ]; then
              target_commit="$(gh api "repos/$GH_REPO/commits/$release_target" --jq .sha)"
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$target_commit" \
                >/dev/null
            elif [ "$exact_tag_count" -ne 1 ]; then
              echo "$RELEASE_TAG resolved to $exact_tag_count exact Git refs" >&2
              exit 1
            fi
            verify_tag_target
          }

          if [ "$is_draft" = "true" ]; then
            if [ "$release_target" != "$GITHUB_SHA" ]; then
              if [ "$asset_count" -ne 0 ]; then
                echo "$RELEASE_TAG is a partial Draft for $release_target; refusing to retarget uploaded assets" >&2
                exit 1
              fi
              gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --draft
              release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets,targetCommitish)"
              release_target="$(jq -r '.targetCommitish' <<<"$release_json")"
              if [ "$release_target" != "$GITHUB_SHA" ]; then
                echo "$RELEASE_TAG Draft target is $release_target instead of $GITHUB_SHA" >&2
                exit 1
              fi
            fi
          else
            verify_tag_target
          fi

          if [ -z "$existing" ]; then
            if [ "$is_draft" != "true" ] || [ "$asset_count" -ne 0 ]; then
              echo "$RELEASE_TAG already exists and cannot accept a different Dashboard bundle" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$archive"
          elif [ "$asset_count" -ne 1 ]; then
            echo "$RELEASE_TAG must contain exactly one uploaded Dashboard bundle" >&2
            exit 1
          fi

          mkdir -p existing-asset
          gh release download "$RELEASE_TAG" \
            --pattern "$asset_name" \
            --dir existing-asset
          cmp "$archive" "existing-asset/$asset_name"

          if [ "$is_draft" = "true" ]; then
            prepare_tag_for_publication
            gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
            verify_tag_target
          fi
